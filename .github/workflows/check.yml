name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: tool versions
        run: moon version --all

      - name: moon check
        run: |
          moon update
          moon check --target all --deny-warn

      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      # The CLI supports wasm and native.
      - name: moon test (wasm)
        run: moon test --target wasm

      - name: moon test (native)
        run: moon test --target native

      - name: e2e tests (wasm)
        run: moonx moonbit-community/mooncram@0.0.6 test e2etests --color never

      - name: e2e tests (native)
        run: moonx moonbit-community/mooncram@0.0.6 test e2etests --target native --color never
